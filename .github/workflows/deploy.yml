name: Deploy reviewed player to Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web-dist/**', '.github/workflows/deploy.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: player-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed static package
        run: |
          test -f web-dist/index.html
          test -f web-dist/sw.js
          test -f web-dist/library/catalog.json
          if find web-dist -name '*.mp3' | grep -q .; then echo 'Audio must remain remote'; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
